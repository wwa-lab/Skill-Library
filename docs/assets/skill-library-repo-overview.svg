<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Internal OpenCode Skills Library overview</title>
  <desc id="desc">A family-first repository structure flows through validation and installation scripts into flat OpenCode skill folders.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      text {
        font-family: "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      }
      .title { fill: #f8fafc; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 13px; font-weight: 400; }
      .region-title { font-size: 12px; font-weight: 700; letter-spacing: 0.4px; }
      .box-title { fill: #f8fafc; font-size: 13px; font-weight: 700; }
      .box-subtitle { fill: #cbd5e1; font-size: 10px; font-weight: 500; }
      .tiny { fill: #94a3b8; font-size: 9px; font-weight: 500; }
      .label { fill: #cbd5e1; font-size: 10px; font-weight: 600; }
      .pill { fill: #e2e8f0; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#0f172a"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.75"/>
  <rect x="24" y="24" width="1232" height="672" rx="18" fill="none" stroke="#334155" stroke-width="1"/>

  <text x="48" y="62" class="title">Internal OpenCode Skills Library</text>
  <text x="48" y="86" class="subtitle">Family-first source of truth for reusable team skills, validated and installed into OpenCode.</text>
  <text x="1198" y="56" class="pill" text-anchor="end">38 validated skills</text>
  <text x="1198" y="78" class="tiny" text-anchor="end">16 IBM i + 21 legacy + common example</text>

  <!-- Region boundaries -->
  <rect x="42" y="122" width="364" height="470" rx="14" fill="rgba(15, 23, 42, 0.72)" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="10,5"/>
  <text x="64" y="148" fill="#22d3ee" class="region-title">REPOSITORY SOURCE</text>

  <rect x="458" y="122" width="364" height="470" rx="14" fill="rgba(15, 23, 42, 0.72)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="10,5"/>
  <text x="480" y="148" fill="#fbbf24" class="region-title">QUALITY AND DISTRIBUTION</text>

  <rect x="874" y="122" width="364" height="470" rx="14" fill="rgba(15, 23, 42, 0.72)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="10,5"/>
  <text x="896" y="148" fill="#34d399" class="region-title">OPENCODE RUNTIME</text>

  <!-- Flow connectors -->
  <path d="M 406 346 L 458 346" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <path d="M 822 346 L 874 346" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="432" y="332" class="tiny" text-anchor="middle">validate</text>
  <text x="848" y="332" class="tiny" text-anchor="middle">install</text>

  <!-- Left: repository structure -->
  <g filter="url(#soft-shadow)">
    <rect x="72" y="174" width="304" height="64" rx="8" fill="#0f172a"/>
    <rect x="72" y="174" width="304" height="64" rx="8" fill="#083344" fill-opacity="0.44" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="224" y="200" class="box-title" text-anchor="middle">skills/</text>
    <text x="224" y="218" class="box-subtitle" text-anchor="middle">family-first library layout</text>

    <rect x="72" y="268" width="68" height="76" rx="8" fill="#0f172a"/>
    <rect x="72" y="268" width="68" height="76" rx="8" fill="#1e293b" fill-opacity="0.58" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="106" y="298" class="box-title" text-anchor="middle">common</text>
    <text x="106" y="317" class="tiny" text-anchor="middle">shared</text>

    <rect x="149" y="268" width="68" height="76" rx="8" fill="#0f172a"/>
    <rect x="149" y="268" width="68" height="76" rx="8" fill="#064e3b" fill-opacity="0.42" stroke="#34d399" stroke-width="1.3"/>
    <text x="183" y="298" class="box-title" text-anchor="middle">ibm-i</text>
    <text x="183" y="317" class="tiny" text-anchor="middle">16 skills</text>

    <rect x="226" y="268" width="68" height="76" rx="8" fill="#0f172a"/>
    <rect x="226" y="268" width="68" height="76" rx="8" fill="#312e81" fill-opacity="0.44" stroke="#818cf8" stroke-width="1.3"/>
    <text x="260" y="298" class="box-title" text-anchor="middle">legacy</text>
    <text x="260" y="317" class="tiny" text-anchor="middle">21 skills</text>

    <rect x="303" y="268" width="68" height="76" rx="8" fill="#0f172a"/>
    <rect x="303" y="268" width="68" height="76" rx="8" fill="#4c1d95" fill-opacity="0.38" stroke="#a78bfa" stroke-width="1.3"/>
    <text x="337" y="298" class="box-title" text-anchor="middle">java</text>
    <text x="337" y="317" class="tiny" text-anchor="middle">reserved</text>

    <rect x="72" y="386" width="304" height="132" rx="8" fill="#0f172a"/>
    <rect x="72" y="386" width="304" height="132" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#64748b" stroke-width="1.3"/>
    <text x="224" y="414" class="box-title" text-anchor="middle">skill package shape</text>
    <text x="101" y="445" class="label">SKILL.md</text>
    <text x="101" y="469" class="tiny">references/</text>
    <text x="101" y="493" class="tiny">scripts/</text>
    <text x="244" y="445" class="tiny">assets/</text>
    <text x="244" y="469" class="tiny">examples/</text>
    <text x="244" y="493" class="tiny">tests/</text>
  </g>

  <!-- Middle: validation and install -->
  <g filter="url(#soft-shadow)">
    <rect x="490" y="176" width="300" height="76" rx="8" fill="#0f172a"/>
    <rect x="490" y="176" width="300" height="76" rx="8" fill="#78350f" fill-opacity="0.28" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="640" y="205" class="box-title" text-anchor="middle">metadata and provenance</text>
    <text x="640" y="225" class="box-subtitle" text-anchor="middle">author, source_commit, name strategy</text>

    <rect x="490" y="292" width="300" height="76" rx="8" fill="#0f172a"/>
    <rect x="490" y="292" width="300" height="76" rx="8" fill="#1e40af" fill-opacity="0.32" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="640" y="321" class="box-title" text-anchor="middle">validate-skills.mjs</text>
    <text x="640" y="341" class="box-subtitle" text-anchor="middle">frontmatter, names, metadata, body</text>

    <rect x="490" y="408" width="300" height="76" rx="8" fill="#0f172a"/>
    <rect x="490" y="408" width="300" height="76" rx="8" fill="#7c2d12" fill-opacity="0.30" stroke="#fb923c" stroke-width="1.5"/>
    <text x="640" y="437" class="box-title" text-anchor="middle">install-opencode-skills.mjs</text>
    <text x="640" y="457" class="box-subtitle" text-anchor="middle">domain filter, dry-run, marker-safe copy</text>

    <path d="M 640 252 L 640 292" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
    <path d="M 640 368 L 640 408" fill="none" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  </g>

  <!-- Right: OpenCode runtime -->
  <g filter="url(#soft-shadow)">
    <rect x="906" y="176" width="300" height="76" rx="8" fill="#0f172a"/>
    <rect x="906" y="176" width="300" height="76" rx="8" fill="#064e3b" fill-opacity="0.42" stroke="#34d399" stroke-width="1.5"/>
    <text x="1056" y="205" class="box-title" text-anchor="middle">~/.config/opencode/skills</text>
    <text x="1056" y="225" class="box-subtitle" text-anchor="middle">flat, namespaced runtime folders</text>

    <rect x="906" y="294" width="300" height="120" rx="8" fill="#0f172a"/>
    <rect x="906" y="294" width="300" height="120" rx="8" fill="#083344" fill-opacity="0.42" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="1056" y="322" class="box-title" text-anchor="middle">installed skills</text>
    <text x="940" y="352" class="tiny">ibm-i-code-generator</text>
    <text x="940" y="376" class="tiny">legacy-spec-writer</text>
    <text x="940" y="400" class="tiny">legacy-modernization-orchestrator</text>

    <rect x="906" y="454" width="300" height="64" rx="8" fill="#0f172a"/>
    <rect x="906" y="454" width="300" height="64" rx="8" fill="#1e293b" fill-opacity="0.52" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="1056" y="480" class="box-title" text-anchor="middle">OpenCode agents</text>
    <text x="1056" y="499" class="box-subtitle" text-anchor="middle">load matching skills on demand</text>

    <path d="M 1056 252 L 1056 294" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
    <path d="M 1056 414 L 1056 454" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  </g>

  <!-- Footer legend -->
  <rect x="72" y="626" width="1134" height="44" rx="10" fill="#020617" fill-opacity="0.36" stroke="#334155" stroke-width="1"/>
  <circle cx="99" cy="648" r="5" fill="#22d3ee"/>
  <text x="113" y="652" class="tiny">source layout</text>
  <circle cx="233" cy="648" r="5" fill="#fbbf24"/>
  <text x="247" y="652" class="tiny">governance and tooling</text>
  <circle cx="438" cy="648" r="5" fill="#34d399"/>
  <text x="452" y="652" class="tiny">OpenCode runtime</text>
  <text x="1190" y="652" class="tiny" text-anchor="end">Repo contract: skills only, family-first, metadata-aware, copy-ready.</text>
</svg>
